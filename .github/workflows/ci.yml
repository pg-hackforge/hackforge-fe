name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # 배포물에 들어가는 의존성(dependencies)에 높은 위험 이상 취약점이 있으면 실패. 예외는 audit-allowlist.json(사유·재검토 날짜)
      - run: npm run audit:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
